<script>
'use strict';

// ——— storage, settings, API ———

const STORE = { theme: 'blizz.demo.theme' };

/** Page settings that may have nowhere to live: Blizz serves the demos
 *  sandboxed, and a sandboxed page has no storage at all. The API key never
 *  goes there anyway. */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* no storage here */ } },
};
// Earlier versions could keep the key in the browser — drop what they left.
try { localStorage.removeItem('blizz.demo.key'); localStorage.removeItem('blizz.demo.base'); sessionStorage.removeItem('blizz.demo.key'); } catch (e) { /* no storage */ }

/** API address: the site itself when Blizz serves this page, production
 *  otherwise. It is not a setting: a key typed here goes to Blizz only. */
function apiBase() {
  const h = location.protocol === 'https:' ? location.hostname : '';
  const ours = (d) => h === d || h.endsWith('.' + d);
  return ours('blizz.id') || ours('jizzus.xyz') ? 'https://' + location.host : 'https://blizz.id';
}

// The key lives only in this page's memory: gone when the tab closes or reloads.
const S = { base: apiBase(), key: '' };
const isDemo = () => !S.key;

class ApiError extends Error {
  constructor(status, code, description, field, retryAfter) {
    super(description || code);
    this.status = status; this.code = code; this.description = description || ''; this.field = field || null; this.retryAfter = retryAfter || null;
  }
}

/** Blizz REST v1 call. The key goes only into the Authorization header. */
async function api(method, path, body) {
  const headers = { Authorization: 'Bearer ' + S.key };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let res;
  try {
    // No cookies, no referrer, no cache: the key is the only credential.
    res = await fetch(S.base + '/api/v1' + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body), credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store' });
  } catch (e) {
    throw new ApiError(0, 'network', 'network error');
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (!res.ok) {
    const retry = Number(res.headers.get('Retry-After')) || null;
    throw new ApiError(res.status, (data && data.error) || 'http_' + res.status, (data && data.error_description) || res.statusText, data && data.field, retry);
  }
  return data;
}

/** A failure in words a person can act on. `need` names the access this call requires. */
function explain(e, need) {
  if (!(e instanceof ApiError)) return String(e && e.message || e);
  switch (e.status) {
    case 0: return 'Could not reach ' + S.base + ' — check your connection and try again.';
    case 401: return 'The API key is missing, wrong or revoked. Paste a valid key in Settings.';
    case 403: return 'This key has no access for that (' + e.description + ').' + (need ? ' Create a key with “' + need + '” on Blizz → API.' : '');
    case 429: return 'Rate limited: ' + e.description + '. Retry in ' + (e.retryAfter || 1) + ' s.';
    case 503: return 'Busy or unavailable right now (' + e.description + '). Retry in a moment.';
    default: return e.code + ': ' + e.description + (e.field ? ' (field: ' + e.field + ')' : '');
  }
}

// ——— DOM helpers (text only, never HTML from data) ———

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled') el[k] = v;
      else el.setAttribute(k, v === true ? '' : String(v));

    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}
const $ = (id) => document.getElementById(id);
const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

const ICONS = {
  copy: 'M5.5 5.5h7v7h-7zM3.5 10.5h-0.5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v.5',
  ext: 'M6 3H3.5v9.5H13V10M9 3h4v4M13 3 7.5 8.5',

// ——— formatting ———

const short = (a) => (a && a.length > 12 ? a.slice(0, 4) + '…' + a.slice(-4) : a || '—');
const num = (v) => (v === null || v === undefined || v === '' ? null : typeof v === 'string' ? Number(v) : v);
function sol(v, signed) {
  const n = num(v);

  if (n === 0) return '0';
  const a = Math.abs(n);
  const d = a >= 100 ? 1 : a >= 1 ? 2 : a >= 0.01 ? 3 : 4;
  return (n < 0 ? '−' : signed && n > 0 ? '+' : '') + a.toFixed(d);
}
const share = (v) => (v === null || v === undefined || !isFinite(v) ? '—' : Math.round(v * 100) + '%');
const pct = (v, signed) => (v === null || v === undefined || !isFinite(v) ? '—' : (v < 0 ? '−' : signed && v > 0 ? '+' : '') + Math.abs(v).toFixed(Math.abs(v) >= 100 ? 0 : 1) + '%');

// ——— demo data (deterministic, clearly sample) ———

function rng(seed) {

  for (let i = 0; i < seed.length; i++) x = Math.imul(x ^ seed.charCodeAt(i), 16777619);

    x = Math.imul(x ^ (x >>> 15), 2246822507);

const fakeAddr = (r, n) => Array.from({ length: n || 44 }, () => B58[Math.floor(r() * 58)]).join('');
const COINS = ['FROGE', 'BONKER', 'CATNIP', 'MOONRAT', 'SOLDOG', 'GIGACAT', 'PUMPY', 'HODLR', 'ZOOMER', 'NEKO', 'BLIP', 'TURBO', 'COPIUM', 'LAMBO', 'WAGMI', 'SNOWY', 'ICEPEPE', 'YETI'];
const s9 = (x) => String(Math.round(x * 1e4) / 1e4);

const DEMO = (() => {
  const r = rng('blizz-demo-cockpit');
  const wallets = [{ address: fakeAddr(r), label: 'Main' }, { address: fakeAddr(r), label: 'Copy 2' }];
  const labels = ['scout: tier2', 'swing pro', 'night owl', 'dca grinder', 'fast hands', 'old whale', null];
  const orders = labels.map((label, i) => {
    const amount = [0.1, 0.25, 0.05, 0.2, 0.1, 0.5, 0.15][i];
    return {
      id: 2400 + i, target: fakeAddr(r), wallet: wallets[i % 2].address, label, state: i === 3 ? 'paused' : 'active',
      buy: { amount_sol: String(amount), slippage_pct: 20, slippage_sol: null, once_per_token: false, target_amount_sol: { min: null, max: null }, market_cap_usd: { min: null, max: null }, tip_sol: '0.001', priority_fee_sol: '0.0005' },
      sell: { slippage_pct: 10, tip_sol: '0.001', priority_fee_sol: '0.0005', auto: i === 2 ? [{ type: 'sl', trigger_pct: 40, size_pct: 100 }] : [], timed: [] },
      filters: { dexes: ['pump_fun', 'pump_swap'], quote: 'all', copy_sells: i !== 2, reverse: false, skip_add_ons: false, skip_creator_launch: false, anti_pvp: i === 4 ? { hold_sec: 30, ban_sec: 3600 } : null },
      created_at: new Date(Date.now() - (5 + i * 2) * 86400e3).toISOString(), updated_at: new Date(Date.now() - i * 3600e3).toISOString(),
    };
  });
  const positions = [];
  for (let i = 0; i < 5; i++) {
    const o = orders[i % orders.length];
    const inv = 0.05 + r() * 0.4;
    const val = inv * (0.4 + r() * 1.5);
    positions.push({ wallet: o.wallet, wallet_label: wallets.find((w) => w.address === o.wallet).label, mint: fakeAddr(r, 43) + 'p', symbol: COINS[Math.floor(r() * COINS.length)], name: null,
      order: { kind: 'copy', target: o.target, label: o.label }, tokens: Math.round(inv * 2e6), invested_sol: s9(inv), value_sol: s9(val), pnl_sol: s9(val - inv), pnl_pct: ((val - inv) / inv) * 100,
      mc_usd: Math.round(20000 + r() * 400000), opened_at: new Date(Date.now() - r() * 20 * 3600e3).toISOString(), sellable: true });
  }
  return { wallets, orders, positions };
})();

function demoStats(period) {
  const k = { '1d': 1, '7d': 6, '30d': 22 }[period] || 1;
  const r = rng('stats' + period);
  const edge = [0.18, 0.11, -0.09, 0.04, -0.02, 0.07, 0.14];
  const rows = DEMO.orders.map((o, i) => {
    const rounds = Math.max(0, Math.round((3 + r() * 9) * k * (o.state === 'paused' ? 0.2 : 1)));
    const won = Math.round(rounds * Math.min(0.9, Math.max(0.1, 0.5 + edge[i] * 2 + (r() - 0.5) * 0.1)));
    const copied = rounds * 2 + Math.round(r() * 3);
    const missed = i === 4 ? Math.round(copied * 0.4) : Math.round(copied * r() * 0.08);
    const pnl = Number(o.buy.amount_sol) * rounds * edge[i] * (0.8 + r() * 0.4);
    const fees = copied * 0.00075;
    return {
      target: o.target, label: o.label, wallet: o.wallet, state: o.state, copied, missed,
      capture_pct: copied + missed ? (copied / (copied + missed)) * 100 : null, slot0_pct: 70 + r() * 25,
      pnl_sol: s9(pnl - fees), pnl_pct: rounds ? ((pnl - fees) / (Number(o.buy.amount_sol) * rounds)) * 100 : null, fees_sol: s9(fees),
      rounds, won_rounds: won, win_rate: rounds ? won / rounds : null,
      target_pnl_sol: s9(pnl * (i === 2 ? -3 : 1.6)), target_pnl_pct: rounds ? edge[i] * 160 : null,
      last_target_trade_at: new Date(Date.now() - r() * 3 * 3600e3).toISOString(),
      last_copy_at: o.state === 'paused' ? new Date(Date.now() - 30 * 3600e3).toISOString() : new Date(Date.now() - r() * 3 * 3600e3).toISOString(),
    };
  });
  const sum = (f) => rows.reduce((s, x) => s + num(x[f] || 0), 0);
  const rounds = sum('rounds'), won = sum('won_rounds'), copied = sum('copied'), missed = sum('missed');
  return { period, totals: { orders: rows.length, active: rows.filter((x) => x.state === 'active').length, copied, missed, capture_pct: copied + missed ? (copied / (copied + missed)) * 100 : null,
    pnl_sol: s9(sum('pnl_sol')), fees_sol: s9(sum('fees_sol')), rounds, won_rounds: won, win_rate: rounds ? won / rounds : null }, orders: rows };
}

function demoTrades(target, period) {
  const r = rng('trades' + target + period);
  const trades = [];
  const coins = new Map();
  for (let i = 0; i < 24; i++) {
    const sym = COINS[Math.floor(r() * 8)];
    const side = r() < 0.55 ? 'buy' : 'sell';
    const roll = r();
    const status = roll < 0.74 ? 'landed' : roll < 0.84 ? 'skipped' : roll < 0.93 ? 'missed' : 'failed';
    const reason = status === 'skipped' ? ['buy_target_range', 'buy_token_once', 'skip_add_ons', 'market_cap_range'][Math.floor(r() * 4)] : status === 'failed' ? 'slippage' : null;
    trades.push({ at: new Date(Date.now() - i * (period === '1d' ? 2400e3 : 15000e3) - r() * 600e3).toISOString(), side, mint: sym, symbol: sym, status, reason, via: r() < 0.9 ? 'copy' : 'limit',
      our_sol: status === 'landed' || status === 'failed' ? s9(0.05 + r() * 0.2) : null, our_signature: null, target_sol: s9(0.3 + r() * 3), target_signature: null,
      slot_lag: status === 'landed' ? (r() < 0.8 ? 0 : 1) : null, price_delta_pct: status === 'landed' ? (r() - 0.3) * 4 : null });
    const c = coins.get(sym) || { mint: sym, symbol: sym, pnl_sol: 0, rounds: 0, copied: 0, failed: 0, missed: 0, skipped: 0, open: false };
    if (status === 'landed') c.copied++; else c[status]++;
    if (side === 'sell' && status === 'landed') { c.rounds++; c.pnl_sol += (r() - 0.4) * 0.2; }
    coins.set(sym, c);
  }
  return { target, period, trades, coins: [...coins.values()].map((c) => ({ ...c, pnl_sol: s9(c.pnl_sol), open: r() < 0.3 })) };
}

function demoPositions() {
  const ps = DEMO.positions;
  const tot = (f) => ps.reduce((s, p) => s + num(p[f]), 0);
  const inv = tot('invested_sol'), val = tot('value_sol');
  return { positions: ps, totals: { positions: ps.length, invested_sol: s9(inv), value_sol: s9(val), pnl_sol: s9(val - inv), pnl_pct: inv ? ((val - inv) / inv) * 100 : null } };
}

const PERIODS = [['1d', '1D'], ['7d', '7D'], ['30d', '30D']];
const ST = {
  period: store.get('blizz.cockpit.period') || '1d',
  stats: null, orders: [], positions: null, positionsErr: null, myWallets: new Map(),
  sel: null, tab: 'positions', trades: null, tradesErr: null,
  sort: { col: 'pnl', dir: -1 }, updatedAt: 0, busy: false, pauseUntil: 0, err: null, editing: null, editValue: null,
};

// ——— loading ———

async function listOrders() {
  if (isDemo()) return DEMO.orders;
  let out = [], cursor = null;
  for (let page = 0; page < 3; page++) {
    const q = '/copy/orders?limit=500' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');
    const r = await api('GET', q);
    out = out.concat(r.orders || []);
    cursor = r.next_cursor;
    if (!cursor) break;
  }
  return out;
}

async function refresh(force) {
  if (ST.busy) return;
  if (!force && (document.hidden || document.querySelector('dialog[open]') || ST.editing)) return;
  if (Date.now() < ST.pauseUntil) return;
  ST.busy = true;
  $('refreshBtn').disabled = true;
  try {
    const [stats, orders] = await Promise.all([
      isDemo() ? Promise.resolve(demoStats(ST.period)) : api('GET', '/copy/stats?period=' + ST.period),
      listOrders(),
    ]);
    ST.stats = stats; ST.orders = orders; ST.err = null;
    try {
      ST.positions = isDemo() ? demoPositions() : await api('GET', '/account/positions');
      ST.positionsErr = null;
    } catch (e) { ST.positions = null; ST.positionsErr = e; }
    if (!isDemo() && !ST.myWallets.size) {
      try {
        const w = await api('GET', '/account/wallets');
        for (const x of w.wallets || []) ST.myWallets.set(x.address, x.label || '');
      } catch (e) { /* no Account · read — wallets show as addresses */ }
    } else if (isDemo()) {
      for (const w of DEMO.wallets) ST.myWallets.set(w.address, w.label);
    }
    if (ST.sel && ST.tab === 'trades') await loadTrades();
    ST.updatedAt = Date.now();
  } catch (e) {
    ST.err = e;
    if (e instanceof ApiError && e.status === 429) ST.pauseUntil = Date.now() + (e.retryAfter || 5) * 1000;
  } finally {
    ST.busy = false;
    $('refreshBtn').disabled = false;
    render();
  }
}

async function loadTrades() {
  try {
    ST.trades = isDemo() ? demoTrades(ST.sel, ST.period) : await api('GET', '/copy/orders/' + encodeURIComponent(ST.sel) + '/trades?period=' + ST.period + '&limit=100');
    ST.tradesErr = null;
  } catch (e) {
    ST.trades = null; ST.tradesErr = e;
    if (e instanceof ApiError && e.status === 429) ST.pauseUntil = Date.now() + (e.retryAfter || 5) * 1000;
  }
}

// ——— writes ———

function needKey() {
  if (!isDemo()) return false;
  toast('Demo mode: changes need an API key with “Copy orders · write”.');
  return true;
}

/** On/off. Pausing is safe and immediate; resuming trades real SOL, so it asks first. */
async function toggle(row) {
  if (needKey()) return;
  const order = row.order;
  const on = order.state !== 'active';
  if (on) {
    const ok = await confirmBox({ title: 'Resume copying?', text: 'Blizz starts copying ' + (row.label || short(row.target)) + ' again, buying up to ' + order.buy.amount_sol + ' SOL per copied buy from ' + walletName(row.wallet) + '.', ok: 'Resume' });
    if (!ok) return;
  }
  const prev = order.state;
  order.state = on ? 'active' : 'paused';
  render();
  try {
    await api('PATCH', '/copy/orders/' + encodeURIComponent(row.target), { state: order.state });
    toast((on ? 'Resumed ' : 'Paused ') + (row.label || short(row.target)));
    await refresh(true);
  } catch (e) {
    order.state = prev;
    toast(explain(e, 'Copy orders · write'));
    render();
  }
}

async function setAmount(row, value) {
  if (needKey()) return;
  const v = value.trim().replace(',', '.');
  if (!/^\d+(\.\d{1,9})?$/.test(v) || Number(v) <= 0) { toast('Enter an amount in SOL, e.g. 0.1'); return; }
  const ok = await confirmBox({ title: 'Change the size?', text: 'Most to spend per copied buy for ' + (row.label || short(row.target)) + ': ' + (row.order ? row.order.buy.amount_sol : '?') + ' → ' + v + ' SOL.', ok: 'Change' });
  if (!ok) return;
  try {
    await api('PATCH', '/copy/orders/' + encodeURIComponent(row.target), { buy: { amount_sol: v } });
    row.order.buy.amount_sol = v;
    toast('Size changed to ' + v + ' SOL');
    render();
    await refresh(true);
  } catch (e) {
    toast(explain(e, 'Copy orders · write'));
    render();
  }
}

async function remove(row) {
  if (needKey()) return;
  const ok = await confirmBox({ title: 'Delete this copy order?', text: 'Copying ' + (row.label || short(row.target)) + ' stops for good. Open positions stay in the wallet. Pausing keeps the order and its TP/SL — consider that instead.', ok: 'Delete', danger: true });
  if (!ok) return;
  try {
    await api('DELETE', '/copy/orders/' + encodeURIComponent(row.target));
    toast('Deleted');
    ST.orders = ST.orders.filter((o) => o.target !== row.target);
    if (ST.sel === row.target) { ST.sel = null; ST.trades = null; ST.tab = 'positions'; }
    render();
    await refresh(true);
  } catch (e) { toast(explain(e, 'Copy orders · write')); }
}

async function setAll(state) {
  if (needKey()) return;
  const n = ST.orders.filter((o) => o.state !== state).length;
  if (!n) { toast(state === 'paused' ? 'Everything is already paused' : 'Everything is already active'); return; }
  const ok = state === 'paused'
    ? await confirmBox({ title: 'Pause all copy orders?', text: 'Kill switch: ' + n + ' order' + (n === 1 ? '' : 's') + ' stop copying new trades. Open positions keep their TP/SL and timers.', ok: 'Pause all', danger: true })
    : await confirmBox({ title: 'Resume all copy orders?', text: n + ' paused order' + (n === 1 ? '' : 's') + ' start copying again with real SOL.', ok: 'Resume all' });
  if (!ok) return;
  try {
    const r = await api('PATCH', '/copy/orders', { all: true, patch: { state } });
    const failed = new Set((r.failed || []).map((f) => f.target));
    for (const o of ST.orders) if (!failed.has(o.target)) o.state = state;
    toast((state === 'paused' ? 'Paused ' : 'Resumed ') + r.done + (failed.size ? ', failed ' + failed.size : ''));
    render();
    await refresh(true);
  } catch (e) { toast(explain(e, 'Copy orders · write')); }
}

function confirmBox({ title, text, ok, danger }) {
  return new Promise((resolve) => {
    const dlg = $('dlg');
    let answer = false;
    const done = (v) => { answer = v; dlg.close(); };
    dlg.onclose = () => resolve(answer);
    clear(dlg).append(h('div', { class: 'dlg' },
      h('h2', null, title), h('p', null, text),
      h('div', { class: 'dlg-f' },
        h('button', { class: 'btn', onclick: () => done(false) }, 'Cancel'),
        h('button', { class: 'btn ' + (danger ? 'danger fill' : 'primary'), onclick: () => done(true) }, ok))));
    dlg.showModal();
  });
}

const walletName = (a) => ST.myWallets.get(a) || short(a);

function rowsJoined() {
  const stats = new Map(((ST.stats && ST.stats.orders) || []).map((s) => [s.target, s]));
  const rows = ST.orders.map((o) => ({ ...(stats.get(o.target) || { copied: 0, missed: 0, capture_pct: null, slot0_pct: null, pnl_sol: '0', pnl_pct: null, rounds: 0, won_rounds: 0, win_rate: null, target_pnl_sol: null, last_copy_at: null }),
    target: o.target, label: o.label, wallet: o.wallet, state: o.state, order: o }));
  const key = {
    pnl: (x) => num(x.pnl_sol) || 0, rounds: (x) => x.rounds || 0, win: (x) => (x.win_rate === null ? -1 : x.win_rate),
    capture: (x) => (x.capture_pct === null ? -1 : x.capture_pct), last: (x) => Date.parse(x.last_copy_at) || 0, amount: (x) => num(x.order.buy.amount_sol) || 0,
  }[ST.sort.col];
  rows.sort((a, b) => (key(a) - key(b)) * ST.sort.dir);

}

function renderTrades(b) {
  if (!ST.sel) { b.append(h('div', { class: 'empty' }, 'Press “Trades” on an order to see its trade feed.')); return; }
  if (ST.tradesErr) { b.append(h('div', { class: 'err', style: 'padding-top:12px' }, explain(ST.tradesErr, 'Copy orders · read'))); return; }
  if (!ST.trades) { b.append(h('div', { class: 'skel', style: 'margin-top:14px;width:80%' })); return; }
  const coins = (ST.trades.coins || []).slice().sort((a, c) => num(c.pnl_sol) - num(a.pnl_sol));
  if (coins.length) {
    b.append(h('div', { class: 'kicker', style: 'margin-top:14px' }, 'Coins'));
    for (const c of coins.slice(0, 8)) {
      b.append(h('div', { class: 'item' },
        h('span', { class: 'a' }, c.symbol || short(c.mint), c.open ? h('span', { class: 'faint', style: 'font-weight:400' }, ' · open') : null),
        h('span', { class: 'num ' + tone(c.pnl_sol) }, c.pnl_sol === null ? '—' : sol(c.pnl_sol, true) + ' SOL'),
        h('span', { class: 'b' }, c.copied + ' copied · ' + c.missed + ' missed · ' + c.failed + ' failed · ' + c.skipped + ' skipped'),
        h('span', { class: 'b num' }, c.rounds + ' round' + (c.rounds === 1 ? '' : 's'))));
    }
  }
  b.append(h('div', { class: 'kicker', style: 'margin-top:16px' }, 'Feed · ' + ST.trades.trades.length));
  if (!ST.trades.trades.length) { b.append(h('div', { class: 'empty' }, 'No trades in this period.')); return; }
  for (const t of ST.trades.trades) {
    b.append(h('div', { class: 'item' },
      h('span', { class: 'a' }, h('span', { class: t.side === 'buy' ? 'pos' : 'neg' }, t.side === 'buy' ? 'Buy ' : 'Sell '), t.symbol || short(t.mint), ' ', h('span', { class: 'st ' + t.status }, t.status)),
      h('span', { class: 'num' }, t.our_sol ? sol(t.our_sol) + ' SOL' : '—'),
      h('span', { class: 'b' }, ago(t.at) + (t.via && t.via !== 'copy' ? ' · ' + t.via : '') + (t.reason ? ' · ' + t.reason : '')),
      h('span', { class: 'b num' }, (t.target_sol ? 'target ' + sol(t.target_sol) : '') + (t.slot_lag !== null && t.slot_lag !== undefined ? (t.slot_lag === 0 ? ' · same slot' : ' · +' + t.slot_lag + ' slot' + (t.slot_lag === 1 ? '' : 's')) : '') + (t.price_delta_pct !== null && t.price_delta_pct !== undefined ? ' · ' + pct(t.price_delta_pct, true) : ''))));
  }
}

// ——— settings, theme, mode ———

function renderMode() {
  const p = $('modePill');
  p.classList.toggle('demo', isDemo());
  p.classList.toggle('live', !isDemo());
  $('modeText').textContent = isDemo() ? 'Demo · sample data' : 'Live · ' + S.base.replace(/^https?:\/\//, '');
  const b = clear($('demoBanner'));
  b.classList.toggle('hidden', !isDemo());
  if (isDemo()) b.append(h('span', null, 'Demo mode — sample orders, nothing is sent anywhere. Add an API key with “Copy orders · read” (and “write” to switch orders, “Account · read” for positions) to run your own copy trading here.'),
    h('button', { class: 'btn', onclick: openSettings }, 'Add API key'));
}

function openSettings() {
  const dlg = $('settingsDlg');
  const key = h('input', { class: 'in mono', type: 'password', value: S.key, placeholder: 'sk_…', autocomplete: 'off', spellcheck: 'false', style: 'width:100%' });
  const show = h('input', { type: 'checkbox', onchange: (e) => { key.type = e.target.checked ? 'text' : 'password'; } });
  const save = () => {
    const k = key.value.trim();
    if (k && !/^sk_[A-Za-z0-9]{48}$/.test(k)) { toast('That is not a Blizz API key: it starts with sk_ and has 48 more letters and digits'); return; }
    S.key = k;
    dlg.close();
    Object.assign(ST, { stats: null, orders: [], positions: null, positionsErr: null, myWallets: new Map(), sel: null, trades: null, tradesErr: null, err: null, pauseUntil: 0, tab: 'positions' });
    renderMode();
    render();
    refresh(true);
  };
  clear(dlg).append(h('div', { class: 'dlg' },
    h('h2', null, 'Settings'),
    h('p', null, 'Create a key on Blizz: press API in the header → New key. Read-only cockpit: “Copy orders · read” and “Account · read”. To switch orders on and off, change sizes and delete: “Copy orders · write”.'),
    h('label', { class: 'f' }, h('span', null, 'API key'), key),
    h('label', { class: 'check' }, show, h('span', null, 'Show key')),
    h('p', { class: 'faint', style: 'font-size:12.5px' }, 'The key stays in this tab’s memory until you close or reload it, and goes only to ' + S.base + ', in the Authorization header. Never paste it into a chat or a page you do not trust.'),
    h('div', { class: 'dlg-f' },
      h('button', { class: 'btn danger', onclick: () => { key.value = ''; save(); } }, 'Forget key'),
      h('button', { class: 'btn', onclick: () => dlg.close() }, 'Cancel'),
      h('button', { class: 'btn primary', onclick: save }, 'Save'))));
  dlg.showModal();
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  store.set(STORE.theme, t);
  clear($('themeBtn')).append(icon(t === 'dark' ? 'sun' : 'moon'));
}

function renderPeriod() {
  clear($('periodSeg')).append(h('div', { class: 'seg', role: 'group', 'aria-label': 'Period' }, PERIODS.map(([v, t]) =>
    h('button', { class: ST.period === v ? 'on' : '', onclick: () => { ST.period = v; store.set('blizz.cockpit.period', v); ST.stats = null; ST.trades = null; renderPeriod(); render(); refresh(true); } }, t))));
}

function init() {
  if (!PERIODS.some(([v]) => v === ST.period)) ST.period = '1d';
  setTheme(store.get(STORE.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('themeBtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  $('settingsBtn').addEventListener('click', openSettings);
  $('refreshBtn').append(icon('refresh'));
  $('refreshBtn').addEventListener('click', () => { ST.pauseUntil = 0; refresh(true); });
  $('pauseAllBtn').addEventListener('click', () => setAll('paused'));
  $('resumeAllBtn').addEventListener('click', () => setAll('active'));
  const logo = icon('logo', 20);
  logo.style.color = 'var(--gold)';
  $('brand').append(logo, h('b', null, 'BLIZZ'), h('span', null, 'Copy Cockpit'));
  renderPeriod();
  renderMode();
  render();
  refresh(true);
  // Every 15 s while the tab is visible; a hidden tab spends no requests.
  setInterval(() => refresh(false), 15000);
  setInterval(() => { if (ST.updatedAt) $('updated').textContent = 'updated ' + dur((Date.now() - ST.updatedAt) / 1000) + ' ago'; }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - ST.updatedAt > 15000) refresh(false); });
}

init();
</script>
</body>
</html>
